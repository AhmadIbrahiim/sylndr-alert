name: poll

on:
  # 8 AM – 7 PM Cairo time, every 15 min — 45 runs/day
  # Anchored to UTC; assumes EEST (UTC+3, summer). In winter (EET, UTC+2)
  # local-time window shifts to 7:00 AM – 6:00 PM.
  schedule:
    # Explicit minute list (`0,15,30,45`) instead of `*/15` — same behavior,
    # but GitHub's scheduler indexes the explicit form more reliably after
    # workflow file rewrites.
    - cron: "0,15,30,45 5-15 * * *"
    - cron: "0 16 * * *"
  # Manual trigger
  workflow_dispatch: {}
  # Trigger immediately when code changes are pushed
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/poll.yml"
      - "package.json"
      - "bun.lockb"

permissions:
  contents: write
  # `models: read` enables free-tier access to GitHub Models for AI take
  # generation on new vehicles. Scoped read-only.
  models: read

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run poll
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # GITHUB_TOKEN with `models: read` lets analyze-ai.ts call GitHub
          # Models for new vehicles. Caps at AI_PER_RUN_CAP per poll.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: openai/gpt-4o-mini
          AI_PER_RUN_CAP: "10"
        run: bun scripts/poll.ts

      - name: Commit state + docs
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "sylndr-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ snapshots/ docs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "state: poll @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${BRANCH:-main}" && git push origin "HEAD:${BRANCH:-main}" && exit 0
            echo "push retry $i"
            sleep 5
          done
          exit 1
